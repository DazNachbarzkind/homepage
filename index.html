<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong gegen die KI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Pong gegen die KI</h1>

      <section class="scoreboard" aria-label="Spielstand">
        <div>
          <span>Du</span>
          <strong id="player-score">0</strong>
        </div>
        <div>
          <span>KI</span>
          <strong id="ai-score">0</strong>
        </div>
      </section>

      <canvas id="game" width="900" height="500" aria-label="Pong-Spiel"></canvas>

      <button id="start-button" type="button">Spiel starten</button>
      <p id="status" aria-live="polite">Drücke auf „Spiel starten“.</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
